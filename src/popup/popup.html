<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>术语精准翻译</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="popup-header">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="3" width="20" height="18" rx="4" stroke="currentColor" stroke-width="1.6" />
          <path d="M6 9.5h6M9 7.5v5.5M7 13c.7 1.5 1.9 2.4 3.4 2.8M13.5 16l3-7 3 7M14.6 13.6h3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <div class="brand-text">
        <h1>术语精准翻译</h1>
        <p class="brand-sub">技术文档 · 术语准确统一</p>
      </div>
    </div>
    <button id="settings-btn" class="icon-btn" type="button" title="打开设置" aria-label="打开设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.6" />
        <path d="M19.4 13.5a7.7 7.7 0 0 0 0-3l1.6-1.2-1.8-3.1-1.9.8a7.6 7.6 0 0 0-2.6-1.5L14.4 3h-3.6l-.3 2.5a7.6 7.6 0 0 0-2.6 1.5l-1.9-.8L4.2 9.3 5.8 10.5a7.7 7.7 0 0 0 0 3l-1.6 1.2 1.8 3.1 1.9-.8a7.6 7.6 0 0 0 2.6 1.5l.3 2.5h3.6l.3-2.5a7.6 7.6 0 0 0 2.6-1.5l1.9.8 1.8-3.1-1.6-1.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
      </svg>
    </button>
  </header>

  <main class="popup-main">
    <section class="card page-card">
      <div class="page-status">
        <span id="page-dot" class="status-dot" data-state="loading" aria-hidden="true"></span>
        <span id="page-status-text" class="status-text">正在检测当前页面…</span>
      </div>
      <p id="page-title" class="page-title" hidden></p>
      <p id="page-host" class="page-host" hidden></p>

      <div id="page-progress" class="page-progress" hidden>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text" class="progress-text">0/0</span>
      </div>

      <button id="translate-btn" class="primary-btn" type="button" disabled>翻译此页面</button>
    </section>

    <section class="card">
      <div class="card-row">
        <span class="row-label">整页展示</span>
        <div class="segmented" role="group" aria-label="整页展示模式">
          <button id="mode-bilingual" type="button" class="segment" data-mode="bilingual">双语对照</button>
          <button id="mode-replace" type="button" class="segment" data-mode="replace">仅译文</button>
        </div>
      </div>
      <div class="card-row">
        <span class="row-label">划词翻译</span>
        <label class="switch" for="selection-toggle">
          <input id="selection-toggle" type="checkbox" role="switch" aria-label="开启划词翻译" />
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        </label>
      </div>
    </section>

    <section id="provider-warning" class="warning" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 8v5m0 3.5v.1M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span id="provider-warning-text">当前服务商尚未配置</span>
      <button id="configure-btn" type="button" class="link-btn">去设置</button>
    </section>

    <section class="card provider-card">
      <div class="provider-info">
        <span class="row-label">服务商</span>
        <strong id="provider-name" class="provider-name">—</strong>
      </div>
      <div class="provider-side">
        <span id="provider-kind" class="badge">—</span>
        <button id="options-btn" type="button" class="text-btn">全部设置</button>
      </div>
    </section>

    <section class="shortcut-row" aria-label="快捷键提示">
      <span class="shortcut"><kbd>Alt</kbd><span>+</span><kbd>T</kbd><span class="shortcut-name">整页翻译</span></span>
      <span class="shortcut"><kbd>Alt</kbd><span>+</span><kbd>S</kbd><span class="shortcut-name">划词翻译</span></span>
    </section>
  </main>

  <footer class="popup-footer">
    <span class="footer-tip">内置计算机术语表 · 无数据上传</span>
    <span id="version-text" class="version">v1.0.0</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
